{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroSynapse | Neuro Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Three.js Background Canvas -->
    <canvas id="bg-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>

    <!-- Top Header -->
    <header class="top-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-info d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
                ☰ Menu
            </button>
            <span class="fs-5 text-info fw-bold me-1">⚡ AstroSynapse</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-dark text-success border border-success px-2 py-1">● LIVE</span>
            <div class="text-end border-start ps-2 border-secondary">
                <small class="d-block text-white fw-bold" style="font-size: 0.75rem;">Cmdr. Astronaut</small>
            </div>
        </div>
    </header>

    <!-- Navigation & Main Body -->
    <div class="d-flex w-100">
        <nav class="sidebar d-none d-md-block">
            <a href="{% url 'home' %}" class="nav-item-link">🏠 Dashboard</a>
            <a href="{% url 'eeg_analyzer' %}" class="nav-item-link">🧠 Live EEG Scan</a>
            <a href="{% url 'time_perception' %}" class="nav-item-link">⏱ Reaction Test</a>
            <a href="{% url 'recommendations' %}" class="nav-item-link">💡 Recommendations</a>
        </nav>

        <main class="main-content-area flex-grow-1 p-3">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div class="offcanvas offcanvas-start bg-dark text-white border-end border-info" tabindex="-1" id="mobileSidebar" style="width: 250px;">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title text-info fw-bold">⚡ AstroSynapse</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-3">
            <a href="{% url 'home' %}" class="nav-item-link">🏠 Dashboard</a>
            <a href="{% url 'eeg_analyzer' %}" class="nav-item-link">🧠 Live EEG Scan</a>
            <a href="{% url 'time_perception' %}" class="nav-item-link">⏱ Reaction Test</a>
            <a href="{% url 'recommendations' %}" class="nav-item-link">💡 Recommendations</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Space Particle Animation (Three.js) -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Particle System
        const particleCount = 700;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 15;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0x22d3ee,
            size: 0.025,
            transparent: true,
            opacity: 0.6
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.0008;
            particles.rotation.x += 0.0004;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
