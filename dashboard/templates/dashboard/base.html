{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroSynapse | Neuro Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header class="top-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <span class="fs-4 text-info fw-bold me-2">⚡ AstroSynapse</span>
            <span class="badge bg-dark border border-info text-cyan d-none d-md-inline-block" style="font-size: 0.65rem;">REAL-TIME ASTRONAUT TELEMETRY</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="badge bg-dark text-success border border-success px-2 py-1">● LIVE SIGNAL</span>
            <small class="text-muted d-none d-sm-inline" id="live-timestamp">UTC --:--:--</small>
            <div class="text-end border-start ps-3 border-secondary">
                <small class="d-block text-white fw-bold">Cmdr. Astronaut</small>
                <small class="text-info" style="font-size:0.7rem;">Deep Space Station</small>
            </div>
        </div>
    </header>

    <div class="d-flex">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <a href="{% url 'home' %}" class="nav-item-link">🏠 Dashboard</a>
            <a href="{% url 'eeg_analyzer' %}" class="nav-item-link">🧠 Live EEG Scan</a>
            <a href="{% url 'time_perception' %}" class="nav-item-link">⏱ Reaction Test</a>
            <a href="{% url 'recommendations' %}" class="nav-item-link">💡 Recommendations</a>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-grow-1 p-4 overflow-hidden">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Live UTC Clock Logic
        function updateUTCClock() {
            const now = new Date();
            const timeStr = now.toISOString().replace('T', ' | UTC ').substring(0, 22);
            document.getElementById('live-timestamp').innerText = timeStr;
        }
        setInterval(updateUTCClock, 1000);
        updateUTCClock();
    </script>
</body>
</html>
